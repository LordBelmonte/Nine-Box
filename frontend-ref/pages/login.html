<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Portal de Gestão de Pessoas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: var(--bg); }
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      border: 1.5px solid var(--border);
    }
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .login-logo i { font-size: 40px; color: var(--primary-light); }
    .login-logo h1 { font-size: 20px; font-weight: 700; color: var(--primary); text-align: center; }
    .login-logo p  { font-size: 13px; color: var(--text-muted); text-align: center; }
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .login-field .input-wrap { position: relative; }
    .login-field .input-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .login-field input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-field input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      outline: none;
      background: var(--surface);
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(30, 58, 138, 0.25);
    }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .login-info {
      margin-top: 20px;
      padding: 12px 14px;
      background: #eff6ff;
      border-radius: var(--radius-sm);
      border: 1px solid #bfdbfe;
      font-size: 12px;
      color: #1e40af;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .login-info i { margin-top: 1px; flex-shrink: 0; }
    .login-error {
      margin-top: 12px;
      padding: 10px 14px;
      background: #fef2f2;
      border-radius: var(--radius-sm);
      border: 1px solid #fecaca;
      font-size: 13px;
      color: #991b1b;
      display: none;
    }
    body.dark-mode .login-card  { background: #1e293b; }
    body.dark-mode .login-field input { background: #0f172a; color: #f1f5f9; border-color: #334155; }
    body.dark-mode .login-info  { background: #1e3a5f; border-color: #1e40af; color: #93c5fd; }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-people-group"></i>
      <h1>Portal de Gestão de Pessoas</h1>
      <p>Acesse com seu e-mail institucional</p>
    </div>

    <div class="login-field">
      <label for="login-email">E-mail institucional</label>
      <div class="input-wrap">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="login-email" placeholder="nome@faculdade.edu.br" autocomplete="email">
      </div>
    </div>

    <div class="login-field">
      <label for="login-senha">Senha</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-senha" placeholder="Sua senha" autocomplete="current-password">
      </div>
    </div>

    <!-- Erro genérico de rede/módulo -->
    <div class="login-error" id="login-error-box"></div>

    <!-- Botão usa ID em vez de onclick para não depender de escopo global -->
    <button class="login-btn" id="btn-login" type="button">
      <i class="fa-solid fa-right-to-bracket"></i> Entrar
    </button>

    <div class="login-info">
      <i class="fa-solid fa-circle-info"></i>
      <span>Apenas usuários cadastrados podem acessar o sistema.</span>
    </div>

    <div class="login-info" id="logout-info" style="display:none; background:#fef2f2; border-color:#fecaca; color:#991b1b;">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>Você já está logado. <a href="#" id="link-logout" style="text-decoration:underline;color:#991b1b;font-weight:600;">Clique aqui para sair</a> e fazer login com outra conta.</span>
    </div>
  </div>
</div>

<script type="module">
  /**
   * login.html — script de autenticação
   *
   * USA addEventListener em vez de onclick inline para evitar
   * o erro "fazerLogin is not defined" caso o módulo demore ou falhe.
   *
   * O erro ocorre porque onclick="fazerLogin()" chama uma função global
   * que só existe se o <script type="module"> tiver terminado de carregar.
   * Se qualquer import falhar, o módulo aborta e a função nunca é registrada.
   *
   * Com addEventListener, o botão simplesmente não faz nada antes do módulo
   * carregar, em vez de lançar ReferenceError.
   */

  // Imports — se qualquer um falhar, o catch no final exibe mensagem amigável
  let usersApi, setToken, setUser, isLoggedIn, getUser, logout, validateLoginForm, showToast;

  try {
    ({ usersApi }                            = await import('../js/api.js'));
    ({ setToken, setUser, isLoggedIn, getUser, logout } = await import('../js/auth.js'));
    ({ validateLoginForm }                   = await import('../js/validators.js'));
    ({ showToast }                           = await import('../js/components/toast.js'));
  } catch (importErr) {
    console.error('[LOGIN] Erro ao carregar módulos:', importErr);
    const box = document.getElementById('login-error-box');
    if (box) {
      box.textContent = 'Erro ao carregar a aplicação. Verifique sua conexão e recarregue a página.';
      box.style.display = 'block';
    }
    // Não prosseguir — módulos não carregaram
    throw importErr;
  }

  // ── Se já está logado, redirecionar ou mostrar opção de logout ─────────────
  if (isLoggedIn()) {
    const user = getUser();
    const logoutInfo = document.getElementById('logout-info');
    if (logoutInfo) logoutInfo.style.display = 'flex';

    setTimeout(() => {
      if (user && (user.tipo === 'colaborador' || user.tipo === 'gestor')) {
        window.location.href = 'avaliacoes.html';
      } else {
        window.location.href = '../index.html';
      }
    }, 5000);
  }

  // ── Link "sair" no aviso de já logado ─────────────────────────────────────
  document.getElementById('link-logout')?.addEventListener('click', (e) => {
    e.preventDefault();
    logout();
    window.location.reload();
  });

  // ── Função de login ────────────────────────────────────────────────────────
  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;

    // Ocultar erro anterior
    const errorBox = document.getElementById('login-error-box');
    if (errorBox) errorBox.style.display = 'none';

    if (!validateLoginForm({ email, senha })) return;

    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

    try {
      const res = await usersApi.login({ email, senha });
      setToken(res.data.token);
      setUser(res.data.user);

      if (res.data.user.tipo === 'colaborador' || res.data.user.tipo === 'gestor') {
        window.location.href = 'avaliacoes.html';
      } else {
        window.location.href = '../index.html';
      }
    } catch (err) {
      // Erro já exibido via toast pelo api.js
      // Exibir também no errorBox para garantir visibilidade
      if (errorBox && err.message) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
    }
  }

  // ── Registrar listeners ────────────────────────────────────────────────────
  document.getElementById('btn-login')?.addEventListener('click', fazerLogin);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fazerLogin();
  });
</script>
</body>
</html>
